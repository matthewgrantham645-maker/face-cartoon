<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 自拍 · AI-FacialLab</title>
  <style>
    :root {
      --canvas: #F7F6F2;
      --ink: #050505;
      --muted: #77736B;
      --line: #E5E1D8;
      --blue: #0057FF;
      --paper: #FFF0C7;
      --shadow: 0 16px 40px rgba(28, 28, 28, .06);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input, textarea { font: inherit; color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    main { max-width: 1180px; margin: auto; padding: 28px 32px 56px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .brand { margin: 0; font-size: 22px; font-weight: 650; }
    .brand span { margin-left: 10px; color: var(--muted); font-weight: 500; font-size: 15px; }
    .mast { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 12px; }
    a { color: var(--ink); text-decoration: none; }
    a:hover { color: var(--blue); }
    .badge { padding: 4px 10px; border-radius: 999px; background: #e8f0ff; color: var(--blue); font-size: 12px; }
    .stage { margin-top: 22px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    .lens, .result { position: relative; border-radius: 16px; overflow: hidden; aspect-ratio: 16/9; background: #eceae4; }
    .result { background: var(--paper); }
    video, .lens img, .result img { display: block; width: 100%; height: 100%; object-fit: contain; }
    video { transform: scaleX(-1); background: #eceae4; }
    .aperture { position: absolute; left: 50%; top: 50%; width: 34%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--blue); box-shadow: 0 0 0 10px rgba(0, 87, 255, .08), inset 0 0 0 1px rgba(0, 87, 255, .35); pointer-events: none; }
    .aperture::before { content: ""; position: absolute; inset: -18px; border-radius: 50%; border: 1px solid rgba(5, 5, 5, .16); }
    .marks { position: absolute; inset: 16px; pointer-events: none; background: linear-gradient(#050505, #050505) left top / 22px 1.5px no-repeat, linear-gradient(#050505, #050505) left top / 1.5px 22px no-repeat, linear-gradient(#050505, #050505) right top / 22px 1.5px no-repeat, linear-gradient(#050505, #050505) right top / 1.5px 22px no-repeat, linear-gradient(#050505, #050505) left bottom / 22px 1.5px no-repeat, linear-gradient(#050505, #050505) left bottom / 1.5px 22px no-repeat, linear-gradient(#050505, #050505) right bottom / 22px 1.5px no-repeat, linear-gradient(#050505, #050505) right bottom / 1.5px 22px no-repeat; }
    .tag { position: absolute; left: 12px; top: 12px; padding: 2px 8px; border-radius: 999px; background: #fff; font-size: 12px; }
    .empty { position: absolute; inset: 0; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 20px; margin-top: 18px; }
    button { border: 1px solid transparent; border-radius: 999px; background: transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; }
    button:disabled { opacity: .38; cursor: default; }
    button.primary { width: 84px; height: 84px; border-radius: 50%; background: var(--blue); color: #fff; font-weight: 650; box-shadow: 0 0 0 7px #fff, 0 0 0 8px var(--line); }
    button.primary:disabled { background: #b9c7ea; }
    .quiet { display: flex; flex-wrap: wrap; gap: 4px; }
    .quiet button:hover:not(:disabled) { color: var(--ink); }
    .status { min-height: 1.4em; margin: 12px 0 0; text-align: center; color: var(--muted); font-size: 13px; }
    .below { display: grid; grid-template-columns: 1.4fr .8fr; gap: 16px; margin-top: 16px; }
    .editor { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button { border-color: var(--line); background: #fff; color: var(--ink); }
    .chips button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
    details { margin-top: 14px; }
    summary { cursor: pointer; color: var(--muted); font-size: 14px; }
    textarea, input[type="text"] { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fff; }
    textarea { min-height: 148px; margin-top: 12px; resize: vertical; }
    .save-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .save-row button { display: inline-flex; align-items: center; gap: 6px; border-color: var(--line); background: #fff; color: var(--ink); }
    .save-row svg { display: block; }
    .strip { display: flex; gap: 10px; overflow-x: auto; min-height: 92px; }
    .shot { flex: 0 0 132px; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
    .shot img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--paper); display: block; }
    .shot span { display: block; padding: 4px 8px 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .shot[aria-current="true"] { border-color: var(--blue); }
    #historyEmpty { margin: 0; color: var(--muted); font-size: 13px; }
    @media (max-width: 860px) {
      main { padding: 18px 14px 36px; }
      .compare, .below { grid-template-columns: 1fr; }
      button.primary { width: 72px; height: 72px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 class="brand">AI-FacialLab <span>自拍</span></h1>
      <div class="mast"><a href="/home/">主页</a> <span id="keyState" class="badge">配置</span></div>
    </header>
    <section class="stage">
      <div class="compare">
        <div>
          <h2 id="finderLabel">取景</h2>
          <div class="lens">
            <video id="video" muted autoplay playsinline></video>
            <img id="frozen" alt="已定格的自拍" hidden>
            <span class="aperture" aria-hidden="true"></span>
            <span class="marks" aria-hidden="true"></span>
            <span id="freezeTag" class="tag" hidden>已定格</span>
          </div>
        </div>
        <div>
          <h2>生成图</h2>
          <div class="result">
            <img id="result" alt="生成的自拍" hidden>
            <p id="resultEmpty" class="empty"></p>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="shutter" class="primary" type="button" disabled>自拍</button>
        <div class="quiet">
          <button id="again" type="button" disabled>再生成</button>
          <button id="retake" type="button" disabled>重拍</button>
          <button id="download" type="button" disabled>下载这张图</button>
        </div>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">正在打开摄像头…</p>
    </section>
    <div class="below">
      <section class="editor">
        <div id="chips" class="chips"></div>
        <details>
          <summary>编辑或添加提示词</summary>
          <textarea id="prompt" aria-label="提示词"></textarea>
          <input id="styleName" type="text" maxlength="24" autocomplete="off" aria-label="名称" placeholder="名称">
          <div class="save-row">
            <button id="saveStyle" type="button"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5v11M1.5 7h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>添加</button>
            <button id="updateStyle" type="button" disabled>更新</button>
            <button id="deleteStyle" type="button" disabled>删除</button>
          </div>
        </details>
      </section>
      <section class="editor">
        <h2>本次记录</h2>
        <div id="history" class="strip"></div>
        <p id="historyEmpty">还没有</p>
      </section>
    </div>
  </main>
  <script src="./library.js"></script>
  <script src="./app.js"></script>
</body>
</html>
