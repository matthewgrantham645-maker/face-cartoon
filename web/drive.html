<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>涂鸦跟着动</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    .note { color: var(--muted); }
    .stages { align-items: start; }
    .view { flex: none; width: 100%; aspect-ratio: 16 / 9; min-height: 0; }
    #camera, #doodle { width: 100%; height: 100%; object-fit: contain; background: #d5e2dc; }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">定稿一张 · 脸在带动</p>
      <h1>涂鸦跟着动</h1>
    </div>
    <p class="status" id="status" role="status">正在准备</p>
  </header>
  <main class="stages">
    <section class="stage" aria-label="摄像头">
      <p class="stage-label">摄像头</p>
      <div class="view"><canvas id="camera"></canvas></div>
    </section>
    <section class="stage" aria-label="蜡笔涂鸦">
      <p class="stage-label">蜡笔涂鸦</p>
      <div class="view"><canvas id="doodle"></canvas></div>
    </section>
  </main>
  <footer class="bar">
    <p class="note" id="note">大模型只出过这一张。右边用你的头和眼睛带着它动。</p>
  </footer>
  <video id="video" playsinline autoplay muted hidden></video>
  <script type="module" src="/static/drive.js?v=3"></script>
</body>
</html>
